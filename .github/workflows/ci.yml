name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    # Unit and end-to-end tests for the engine, API, CLI, MCP server and UI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l app cmd internal)" || { gofmt -l app cmd internal; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Lint preset switch scripts
        run: |
          go build -o /tmp/simpletoggle ./cmd/simpletoggle
          for f in internal/presets/switches/*.sh internal/presets/library/*.sh; do
            bash -n "$f"
            /tmp/simpletoggle validate "$f"
          done
